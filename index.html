<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Taquilla Cevichestudios</title>
  <script src="https://unpkg.com/html5-qrcode"></script>
  <style>
    *{box-sizing:border-box}
    body{font-family:Arial,sans-serif;background:#f3f3f3;margin:0;padding:16px;color:#222}
    main{max-width:520px;margin:auto;background:white;padding:20px;border-radius:14px;box-shadow:0 2px 12px #0002}
    h2{text-align:center}
    button,input{width:100%;padding:13px;margin-top:9px;border-radius:8px;font-size:16px}
    button{border:0;background:#222;color:white;cursor:pointer}
    button:disabled{opacity:.5}
    input{border:1px solid #bbb}
    #reader{width:100%;margin-top:18px}
    #resultado{margin-top:16px;padding:14px;background:#eee;border-radius:8px;line-height:1.5}
    .dato{display:flex;justify-content:space-between;gap:10px;padding:7px 0;border-bottom:1px solid #ddd}
    .acciones{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin-top:12px}
    .acciones button{margin:0}
    .verde{background:#087443}
    .rojo{background:#a12626}
    .oculto{display:none}
    .estado{font-weight:bold;text-align:center;margin-top:12px}
    .pequeno{font-size:13px;color:#666;text-align:center}
  </style>
</head>
<body>
<main>
  <h2>Taquilla Cevichestudios</h2>
  <p class="pequeno">Lector de ingreso de asistentes</p>

  <div id="configuracion" class="oculto">
    <p>Falta iniciar desde el panel de la tiquetera.</p>
  </div>

  <div id="zonaEscaner">
    <button id="iniciar" class="verde">ABRIR CÁMARA</button>
    <button id="detener" class="rojo oculto">DETENER CÁMARA</button>
    <div id="reader"></div>
  </div>

  <div id="resultado">Esperando lectura del código QR.</div>

  <div id="compra" class="oculto">
    <div id="datosCompra"></div>
    <label for="cantidad">¿Cuántas boletas ingresan?</label>
    <input id="cantidad" type="number" min="1" step="1">
    <div class="acciones">
      <button id="todas" class="verde">Registrar todas</button>
      <button id="parcial">Registrar cantidad</button>
    </div>
    <button id="cancelar" class="rojo">Cancelar y seguir escaneando</button>
  </div>

  <div id="mensaje" class="estado"></div>
</main>

<script>
  const params = new URLSearchParams(window.location.search);
  let API_URL = params.get('api') || '';
  let SESSION = params.get('session') || '';

  // Guardar la sesión en esta pestaña y quitar los datos de la dirección.
  if (API_URL && SESSION) {
    sessionStorage.setItem('taquilla_api', API_URL);
    sessionStorage.setItem('taquilla_session', SESSION);
    history.replaceState({}, document.title, window.location.pathname);
  } else {
    API_URL = sessionStorage.getItem('taquilla_api') || '';
    SESSION = sessionStorage.getItem('taquilla_session') || '';
  }

  let scanner = null;
  let compraActual = null;
  let codigoActual = '';
  let procesando = false;
  let camaraActiva = false;

  const $ = id => document.getElementById(id);

  function mostrarMensaje(texto) {
    $('mensaje').textContent = texto;
  }

  function llamadaAPI(action, datos = {}) {
    return new Promise((resolve, reject) => {
      if (!API_URL || !SESSION) {
        reject(new Error('Sesión no válida. Abre nuevamente el lector desde la tiquetera.'));
        return;
      }

      const callback = 'taquilla_cb_' + Date.now() + '_' + Math.floor(Math.random() * 100000);
      const script = document.createElement('script');
      let terminado = false;

      const limpiar = () => {
        if (terminado) return;
        terminado = true;
        delete window[callback];
        script.remove();
      };

      window[callback] = respuesta => {
        limpiar();
        if (respuesta && respuesta.ok) resolve(respuesta.data);
        else reject(new Error(respuesta?.message || 'No se pudo completar la operación.'));
      };

      const parametros = new URLSearchParams({
        api: 'taquilla',
        callback: callback,
        session: SESSION,
        action: action,
        _: String(Date.now())
      });

      Object.keys(datos).forEach(k => parametros.set(k, datos[k]));

      script.onerror = () => {
        limpiar();
        reject(new Error('No se pudo conectar con la tiquetera. Revisa la conexión.'));
      };

      script.src = API_URL + '?' + parametros.toString();
      document.body.appendChild(script);

      setTimeout(() => {
        if (!terminado) {
          limpiar();
          reject(new Error('La conexión tardó demasiado. Intenta nuevamente.'));
        }
      }, 20000);
    });
  }

  function extraerCodigo(texto) {
    const valor = String(texto || '').trim();

    try {
      const url = new URL(valor);
      const token = url.searchParams.get('t');
      if (token) return token;
    } catch (e) {}

    return valor;
  }

  async function iniciarCamara() {
    if (!API_URL || !SESSION) {
      $('resultado').textContent = 'Abre el lector desde el botón del panel de taquilla.';
      return;
    }

    try {
      if (!scanner) scanner = new Html5Qrcode('reader');

      await scanner.start(
        { facingMode: 'environment' },
        { fps: 12, qrbox: { width: 250, height: 250 } },
        texto => procesarQR(texto),
        () => {}
      );

      camaraActiva = true;
      $('iniciar').classList.add('oculto');
      $('detener').classList.remove('oculto');
      $('resultado').textContent = 'Cámara activa. Enfoca el QR del comprador.';
      mostrarMensaje('');

    } catch (error) {
      $('resultado').textContent = 'No se pudo abrir la cámara: ' + error;
    }
  }

  async function detenerCamara() {
    if (scanner && camaraActiva) {
      try {
        await scanner.stop();
      } catch (e) {}
    }

    camaraActiva = false;
    $('iniciar').classList.remove('oculto');
    $('detener').classList.add('oculto');
  }

  async function procesarQR(texto) {
    if (procesando || compraActual) return;

    procesando = true;
    codigoActual = extraerCodigo(texto);

    await detenerCamara();

    $('resultado').textContent = 'Consultando compra...';
    mostrarMensaje('');

    try {
      const pedido = await llamadaAPI('buscar', { code: codigoActual });
      compraActual = pedido;
      mostrarCompra(pedido);
    } catch (error) {
      $('resultado').textContent = error.message;
      mostrarMensaje('Escanea nuevamente cuando estés listo.');
      procesando = false;
      setTimeout(() => iniciarCamara(), 1800);
    }
  }

  function mostrarCompra(p) {
    $('compra').classList.remove('oculto');

    $('datosCompra').innerHTML = '';

    const datos = [
      ['Comprador', p.buyer],
      ['Compra', p.id],
      ['Evento', p.event],
      ['Boletas compradas', p.bought],
      ['Ya ingresaron', p.entered],
      ['Pendientes', p.pending]
    ];

    datos.forEach(([titulo, valor]) => {
      const fila = document.createElement('div');
      fila.className = 'dato';

      const a = document.createElement('strong');
      a.textContent = titulo;

      const b = document.createElement('span');
      b.textContent = valor;

      fila.append(a, b);
      $('datosCompra').appendChild(fila);
    });

    $('cantidad').value = p.pending;
    $('cantidad').max = p.pending;
    $('cantidad').min = 1;
    $('cantidad').disabled = p.pending === 0;
    $('todas').disabled = p.pending === 0;
    $('parcial').disabled = p.pending === 0;

    $('resultado').textContent = p.pending === 0
      ? 'Esta compra ya tiene todas sus boletas ingresadas.'
      : 'Compra encontrada. Confirma el ingreso.';
  }

  async function registrar(cantidad) {
    if (!compraActual) return;

    if (!Number.isInteger(cantidad) || cantidad < 1 || cantidad > compraActual.pending) {
      mostrarMensaje('Cantidad inválida. Pendientes: ' + compraActual.pending);
      return;
    }

    $('todas').disabled = true;
    $('parcial').disabled = true;
    mostrarMensaje('Registrando ingreso...');

    try {
      const actualizado = await llamadaAPI('registrar', {
        code: codigoActual,
        amount: cantidad
      });

      compraActual = actualizado;
      mostrarCompra(actualizado);
      mostrarMensaje('Ingreso registrado correctamente.');

      setTimeout(() => siguienteEscaneo(), 1300);

    } catch (error) {
      mostrarMensaje(error.message);
      $('todas').disabled = false;
      $('parcial').disabled = false;
    }
  }

  function siguienteEscaneo() {
    compraActual = null;
    codigoActual = '';
    procesando = false;

    $('compra').classList.add('oculto');
    $('resultado').textContent = 'Listo para escanear al siguiente comprador.';
    mostrarMensaje('');

    iniciarCamara();
  }

  $('iniciar').addEventListener('click', iniciarCamara);
  $('detener').addEventListener('click', detenerCamara);

  $('todas').addEventListener('click', () => {
    if (compraActual) registrar(compraActual.pending);
  });

  $('parcial').addEventListener('click', () => {
    registrar(Number($('cantidad').value));
  });

  $('cancelar').addEventListener('click', siguienteEscaneo);

  if (!API_URL || !SESSION) {
    $('resultado').textContent = 'Abre este lector desde el botón ABRIR LECTOR QR del panel de taquilla.';
    $('iniciar').disabled = true;
  }
</script>
</body>
</html>
